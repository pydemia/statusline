name: Bootstrap Statusline source

# Final bootstrap trigger after all archive chunks are present.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/part*.b64 | base64 --decode > /tmp/statusline-source.zip
          echo "054fe53debf08e9acf3a2d5d3d734466f5750a81f14cc92e3201ba243cb70a57  /tmp/statusline-source.zip" | sha256sum --check -
          unzip -tq /tmp/statusline-source.zip
          mkdir -p /tmp/statusline-source
          unzip -oq /tmp/statusline-source.zip -d /tmp/statusline-source
          rm -f /tmp/statusline-source/.github/workflows/ci.yml

      - name: Replace bootstrap tree with source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=".git/" /tmp/statusline-source/ ./

      - name: Validate
        shell: bash
        run: npm test

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Release Statusline v0.10.2"
          git push origin HEAD:main
